<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (err) {}
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <title>Brightside Studio — Contact</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false">
    <span class="theme-toggle-icon icon-sun" aria-hidden="true">☀️</span>
    <span class="theme-toggle-icon icon-moon" aria-hidden="true">🌙</span>
  </button>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img class="logo-img logo-light" src="images/SynBio_logo_transparent.png" alt="SynBio Stuttgart">
        <img class="logo-img logo-dark" src="images/SynBio_logo_transparent_dark.png" alt="SynBio Stuttgart">
      </a>
      <div class="header-right">
        <nav class="site-nav" id="siteNav">
          <a href="services.html">News</a>
          <div class="nav-dropdown" id="projectsDropdown">
            <button class="nav-dropdown-toggle" id="projectsToggle" aria-haspopup="true" aria-expanded="false">
              Projects <span class="nav-dropdown-arrow" aria-hidden="true">&#9662;</span>
            </button>
            <div class="nav-dropdown-menu" id="projectsMenu">
              <a href="project1.html">Project One</a>
              <a href="project2.html">Project Two</a>
              <a href="project3.html">Project Three</a>
            </div>
          </div>
          <a href="team.html">Team</a>
          <a href="contact.html">Contact</a>
        </nav>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <h1>Inquiries</h1>
      <p>Reach out to us and we'll get back to you as soon as possible</p>
    </div>
  </section>

  <section class="section">
    <div class="container narrow">
      <form id="contactForm" class="contact-form" novalidate>

        <div class="form-group">
          <label for="firstname">First name</label>
          <input type="text" id="firstname" name="firstname" placeholder="Max">
          <span class="error-message" id="firstnameError"></span>
        </div>

        <div class="form-group">
          <label for="lastname">Last name</label>
          <input type="text" id="lastname" name="lastname" placeholder="Mustermann">
          <span class="error-message" id="lastnameError"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="max.muster@example.com">
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="Occupation">Occupation</label>
          <select id="Occupation" name="budget">
            <option value="">Select an occupation</option>
            <option value="iInter-unistu">Internal university student</option>
            <option value="exter-unistu">External university student</option>
            <option value="organization">Organization</option>
            <option value="company">Company</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="How can we help you?"></textarea>
          <span class="error-message" id="messageError"></span>
        </div>

        <button type="submit" class="btn btn-primary">Send message</button>

        <p class="form-success" id="formSuccess" hidden>Your message has been sent - we'll contact you soon.</p>
      </form>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Brightside Studio. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
